<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#08090a" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GOLD AND GLORY" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="GOLD AND GLORY：一款欧洲中世纪题材的英雄职业三消小游戏。"
    />
    <title>GOLD AND GLORY</title>
    <style>
      #game-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f3e4c3;
        background: #080a0c;
        opacity: 1;
        visibility: visible;
        transition: opacity 240ms ease;
      }

      #game-loading.is-hidden {
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 240ms ease, visibility 0s linear 240ms;
      }

      .game-loading__content {
        width: min(72vw, 280px);
        text-align: center;
      }

      .game-loading__spinner {
        position: relative;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
      }

      .game-loading__ring {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 3px solid rgba(168, 145, 94, 0.24);
        border-top-color: #d7b76d;
        border-right-color: #8f713a;
        border-radius: 50%;
        animation: game-loading-spin 900ms linear infinite;
      }

      .game-loading__icon {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        object-fit: contain;
        transform: translate(-50%, -50%);
      }

      .game-loading__brand {
        margin-bottom: 6px;
        color: #d8bd82;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0;
      }

      #game-loading-status {
        min-height: 20px;
        color: #b9ad96;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
      }

      .game-loading__track {
        height: 8px;
        margin-top: 13px;
        overflow: hidden;
        background: #161a1c;
        border: 1px solid #4d4537;
        border-radius: 2px;
      }

      #game-loading-fill {
        width: 0;
        height: 100%;
        background: #c6a459;
        transform-origin: left center;
        transition: width 120ms linear;
      }

      #game-loading-percent {
        margin-top: 8px;
        color: #f3e4c3;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      @keyframes game-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .game-loading__ring { animation-duration: 1800ms; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-_faLRmBR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B6IhRFK2.css">
  </head>
  <body>
    <div id="game-loading" role="status" aria-live="polite" aria-label="游戏加载进度">
      <div class="game-loading__content">
        <div class="game-loading__spinner" aria-hidden="true">
          <span class="game-loading__ring"></span>
          <img class="game-loading__icon" src="assets/medieval/ui/loading-icon.png" alt="" />
        </div>
        <div class="game-loading__brand">GOLD AND GLORY</div>
        <div id="game-loading-status">正在整备远征</div>
        <div class="game-loading__track" aria-hidden="true">
          <div id="game-loading-fill"></div>
        </div>
        <div id="game-loading-percent">0%</div>
      </div>
    </div>
    <div id="game-root"></div>
    <script>
      (() => {
        const root = document.getElementById("game-loading");
        const status = document.getElementById("game-loading-status");
        const fill = document.getElementById("game-loading-fill");
        const percent = document.getElementById("game-loading-percent");
        let displayed = 0;
        let target = 4;
        let ready = false;
        let phaseTimer;
        let animationFrame = 0;
        let bootRetryTimer;

        window.__GAME_BOOT_STARTED__ = false;

        const clearBootRetry = () => window.clearTimeout(bootRetryTimer);
        const recoverStaleBundle = () => {
          if (window.__GAME_BOOT_STARTED__) return;

          const url = new URL(window.location.href);
          if (!url.searchParams.has("boot-retry")) {
            status.textContent = "正在更新远征资源";
            url.searchParams.set("boot-retry", Date.now().toString());
            window.location.replace(url.toString());
            return;
          }

          status.textContent = "资源更新失败，请检查网络后刷新";
        };

        window.addEventListener("game-boot-started", clearBootRetry, { once: true });
        bootRetryTimer = window.setTimeout(recoverStaleBundle, 8000);

        const render = () => {
          const value = Math.max(0, Math.min(100, Math.round(displayed)));
          fill.style.width = `${value}%`;
          percent.textContent = `${value}%`;
          root.setAttribute("aria-label", `游戏加载进度 ${value}%`);
        };

        const animate = () => {
          if (displayed < target) {
            displayed = Math.min(target, displayed + Math.max(1, Math.ceil((target - displayed) * 0.18)));
            render();
          }
          if (ready && displayed >= 100) {
            animationFrame = 0;
            window.setTimeout(() => root.classList.add("is-hidden"), 120);
            return;
          }
          animationFrame = window.requestAnimationFrame(animate);
        };

        window.__GAME_LOADING__ = {
          begin(label = "正在整备远征", startAt = 0) {
            window.clearInterval(phaseTimer);
            displayed = Math.max(0, Math.min(100, startAt));
            target = displayed;
            ready = false;
            status.textContent = label;
            root.classList.remove("is-hidden");
            render();
            if (!animationFrame) animationFrame = window.requestAnimationFrame(animate);
          },
          set(value, label) {
            target = Math.max(target, Math.max(0, Math.min(100, value)));
            if (label) status.textContent = label;
          },
          complete() {
            window.clearInterval(phaseTimer);
            clearBootRetry();
            target = 100;
            ready = true;
          },
        };

        phaseTimer = window.setInterval(() => {
          target = Math.min(12, target + 1);
        }, 220);
        render();
        animationFrame = window.requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
